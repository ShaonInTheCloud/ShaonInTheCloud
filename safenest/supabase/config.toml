# Working directory in the Supabase GitHub integration: safenest
project_id = "safenest"

[auth]
enabled = true
site_url = "https://mysafenestbd.com"
additional_redirect_urls = [
  "https://safenest-bangladesh.kabirmdhumaun23.chatgpt.site/account.html",
  "https://safenest-bangladesh.kabirmdhumaun23.chatgpt.site/account.html?mode=recovery",
  "https://mysafenestbd.com/account.html",
  "https://mysafenestbd.com/account.html?mode=recovery",
  "https://mysafenestbd.com/account",
  "https://mysafenestbd.com/account?mode=recovery",
  "https://safenest-bangladesh.kabirmdhumaun23.chatgpt.site/account",
  "https://safenest-bangladesh.kabirmdhumaun23.chatgpt.site/account?mode=recovery"
]
enable_signup = true
minimum_password_length = 10

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

# Production Auth settings are not deployed by the GitHub integration by
# default. Configure these exact settings in the hosted project dashboard.
# Configure your own SMTP provider in the dashboard before public signups.
[functions.delete-account]
verify_jwt = true

[functions.protection-access]
verify_jwt = true

[functions.start-trial]
verify_jwt = true

# Preserve the live function's own authorization model.
[functions.intelligence]
verify_jwt = false

# Payment callbacks come from the payment gateway or a scheduler and carry no Supabase user JWT.
# Notifications and POST returns use independent gateway validation; GET returns only
# redirect to a fixed account page. Reconciliation requires its own key. The catalogue
# exposes only public prices. Disabling gateway JWT checks grants no payment authority.
[functions.payment-notification]
verify_jwt = false

[functions.payment-return]
verify_jwt = false

[functions.payment-reconcile]
verify_jwt = false

[functions.payment-catalogue]
verify_jwt = false

# DNS-over-HTTPS filter for the iOS DNS profile: iPhone DNS clients send no Supabase JWT.
[functions.dns-query]
verify_jwt = false

[functions.play-billing-verify]
verify_jwt = true

# Pub/Sub push from Google carries no Supabase JWT; the handler checks PLAY_RTDN_SECRET.
[functions.play-billing-rtdn]
verify_jwt = false

# Customer-facing payment endpoints keep the hosted JWT check in addition to their own /auth/v1/user validation.
[functions.payment-order]
verify_jwt = true

[functions.payment-status]
verify_jwt = true
