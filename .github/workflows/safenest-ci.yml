name: SafeNest release checks
on:
  push:
    branches: [main]
    paths: ['safenest/**', '.github/workflows/safenest-ci.yml']
  pull_request:
    paths: ['safenest/**', '.github/workflows/safenest-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safenest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-and-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safenest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: safenest/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node --test supabase/functions/protection-access/test/*.test.mjs
      - run: npm run build
        env:
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_jt2VeNCAATz3iEiebx2Kog_ZiZVL7Vl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: safenest-website
          path: safenest/dist
          retention-days: 14
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safenest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sh run-core-tests.sh
      - run: chmod +x android/gradlew
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./gradlew :app:testPlayDebugUnitTest :app:testDirectDebugUnitTest :app:lintPlayDebug :app:lintDirectDebug :app:assemblePlayDebug :app:assembleDirectDebug :app:bundlePlayRelease
        working-directory: safenest/android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: safenest-android-QA-unsigned-release
          path: |
            safenest/android/app/build/outputs/apk
            safenest/android/app/build/outputs/bundle/playRelease
            safenest/android/app/build/reports/tests
            safenest/android/app/build/reports/lint-results-*
          retention-days: 14
