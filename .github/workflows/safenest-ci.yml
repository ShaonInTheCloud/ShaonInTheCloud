name: SafeNest release checks
on:
  push:
    branches: [main]
    paths: ['safenest/**', '.github/workflows/safenest-ci.yml']
  pull_request:
    paths: ['safenest/**', '.github/workflows/safenest-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safenest-guard-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-and-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safenest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: safenest/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node --test supabase/functions/protection-access/test/*.test.mjs
      - run: npm run build
        env:
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_jt2VeNCAATz3iEiebx2Kog_ZiZVL7Vl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: safenest-website
          path: safenest/dist
          retention-days: 14
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: safenest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check runner Android SDK tools
        id: runner-sdk
        run: |
          for safenest_sdk_manager in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$safenest_sdk_manager" ]; then
              dirname "$safenest_sdk_manager" >> "$GITHUB_PATH"
              echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
              echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
              echo 'ready=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo 'ready=false' >> "$GITHUB_OUTPUT"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        if: steps.runner-sdk.outputs.ready != 'true'
      - run: sh run-core-tests.sh
      - run: chmod +x android/gradlew
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./gradlew :app:testPlayDebugUnitTest :app:testDirectDebugUnitTest :app:testLabDebugUnitTest :app:lintPlayDebug :app:lintDirectDebug :app:lintLabDebug :app:assemblePlayDebug :app:assembleDirectDebug :app:assembleLabDebug :app:bundlePlayRelease
        working-directory: safenest/android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: safenest-android-QA-unsigned-release
          path: |
            safenest/android/app/build/outputs/apk
            safenest/android/app/build/outputs/bundle/playRelease
            safenest/android/app/build/reports/tests
            safenest/android/app/build/reports/lint-results-*
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: safenest-test-apk
          path: safenest/android/app/build/outputs/apk/lab/debug/app-lab-debug.apk
          retention-days: 14
      - name: Prepare disposable Android 16 emulator
        timeout-minutes: 12
        run: |
          sdkmanager 'system-images;android-36;google_apis;x86_64' 'emulator' 'platform-tools'
          safenest_avd_dir="$RUNNER_TEMP/safenest-avd"
          mkdir -p "$safenest_avd_dir"
          export ANDROID_AVD_HOME="$safenest_avd_dir"
          echo "ANDROID_AVD_HOME=$safenest_avd_dir" >> "$GITHUB_ENV"
          echo no | avdmanager create avd --force --name safenest-qa --package 'system-images;android-36;google_apis;x86_64' || true
          # API 36 image metadata may reference an absent devices.xml. Supply a
          # generic phone AVD when avdmanager returns without creating one.
          if [ ! -f "$safenest_avd_dir/safenest-qa.ini" ]; then
            mkdir -p "$safenest_avd_dir/safenest-qa.avd"
            printf '%s\n' 'avd.ini.encoding=UTF-8' "path=$safenest_avd_dir/safenest-qa.avd" 'target=android-36' > "$safenest_avd_dir/safenest-qa.ini"
            printf '%s\n' 'AvdId=safenest-qa' 'avd.ini.encoding=UTF-8' 'abi.type=x86_64' 'hw.cpu.arch=x86_64' 'hw.cpu.ncore=2' 'hw.ramSize=2048' 'hw.lcd.width=1080' 'hw.lcd.height=2400' 'hw.lcd.density=420' 'hw.gpu.enabled=yes' 'hw.gpu.mode=software' 'disk.dataPartition.size=2G' 'tag.id=google_apis' 'tag.display=Google APIs' 'PlayStore.enabled=false' "image.sysdir.1=$ANDROID_HOME/system-images/android-36/google_apis/x86_64/" > "$safenest_avd_dir/safenest-qa.avd/config.ini"
          fi
          # avdmanager's generic default is a tiny legacy display. Use the
          # same phone dimensions whether creation or fallback supplied it.
          sed -i '/^hw.lcd.width=/d; /^hw.lcd.height=/d; /^hw.lcd.density=/d' "$safenest_avd_dir/safenest-qa.avd/config.ini"
          printf '%s\n' 'hw.lcd.width=1080' 'hw.lcd.height=2400' 'hw.lcd.density=420' >> "$safenest_avd_dir/safenest-qa.avd/config.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          mkdir -p android/app/build/guard-device-evidence
          "$ANDROID_HOME/emulator/emulator" -avd safenest-qa -port 5554 -no-window -no-snapshot -gpu software -noaudio -no-boot-anim -camera-back none -camera-front none -memory 2048 -cores 2 > android/app/build/guard-device-evidence/emulator.log 2>&1 &
          safenest_emulator_pid=$!
          for attempt in $(seq 1 120); do
            if ! kill -0 "$safenest_emulator_pid" 2>/dev/null; then cat android/app/build/guard-device-evidence/emulator.log; exit 1; fi
            safenest_boot=$(timeout 5 adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$safenest_boot" = 1 ]; then break; fi
            sleep 2
          done
          if [ "$safenest_boot" != 1 ]; then cat android/app/build/guard-device-evidence/emulator.log; exit 1; fi
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install android/app/build/outputs/apk/play/debug/app-play-debug.apk
      - name: Exercise consented Settings guard on emulator
        timeout-minutes: 12
        run: ./gradlew :app:connectedLabDebugAndroidTest --console=plain
        working-directory: safenest/android
      - name: Capture emulator evidence
        if: always()
        timeout-minutes: 1
        run: |
          mkdir -p android/app/build/guard-device-evidence
          if adb devices | awk 'NR>1 && $2=="device" {found=1} END {exit !found}'; then
            timeout 15 adb pull /sdcard/Download/safenest-guard-qa android/app/build/guard-device-evidence || true
            timeout 10 adb logcat -d -b crash > android/app/build/guard-device-evidence/crash-log.txt || true
            timeout 10 adb shell dumpsys accessibility > android/app/build/guard-device-evidence/accessibility-state.txt || true
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: safenest-guard-device-QA
          path: |
            safenest/android/app/build/guard-device-evidence
            safenest/android/app/build/reports/androidTests/connected
            safenest/android/app/build/outputs/androidTest-results/connected
          retention-days: 14
