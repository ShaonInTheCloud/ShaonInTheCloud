name: SafeNest signed direct APK
# Builds the website-distributed (direct flavor) APK with the dedicated direct-distribution
# key. Separate from the Play upload key on purpose: existing installs from the website keep
# upgrading, and the Play upload key never leaves the Play workflow. Manual only, main only.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed version name (for example 0.5.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: safenest-signed-direct
  cancel-in-progress: false
jobs:
  signed-direct:
    if: github.ref == 'refs/heads/main'
    environment: android-release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: safenest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - run: sh run-core-tests.sh
      - run: python3 -B -m unittest discover -s scripts/test -p 'test_*.py'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and sign the direct APK
        env:
          SAFENEST_DIRECT_KEYSTORE_BASE64: ${{ secrets.SAFENEST_DIRECT_KEYSTORE_BASE64 }}
          SAFENEST_DIRECT_STORE_PASSWORD: ${{ secrets.SAFENEST_DIRECT_STORE_PASSWORD }}
          SAFENEST_DIRECT_KEY_PASSWORD: ${{ secrets.SAFENEST_DIRECT_KEY_PASSWORD }}
          SAFENEST_DIRECT_KEY_ALIAS: ${{ secrets.SAFENEST_DIRECT_KEY_ALIAS }}
          SAFENEST_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          umask 077
          export SAFENEST_DIRECT_KEYSTORE="$RUNNER_TEMP/safenest-direct.jks"
          trap 'rm -f "$SAFENEST_DIRECT_KEYSTORE"' EXIT
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ.get('SAFENEST_DIRECT_KEYSTORE_BASE64', '')
          if not raw or len(raw) > 1024 * 1024:
              raise SystemExit('Direct-distribution signing configuration is missing or invalid')
          Path(os.environ['SAFENEST_DIRECT_KEYSTORE']).write_bytes(base64.b64decode(raw, validate=True))
          PY
          unset SAFENEST_DIRECT_KEYSTORE_BASE64
          # Fail before building if the supplied key is not the permanent direct key.
          python3 -I scripts/verify-direct-signing.py --keystore "$SAFENEST_DIRECT_KEYSTORE"
          grep -q "versionName = \"$SAFENEST_RELEASE_VERSION\"" android/app/build.gradle.kts || { echo "Version $SAFENEST_RELEASE_VERSION is not the source version"; exit 1; }
          chmod +x android/gradlew
          (cd android && ./gradlew :app:testDirectReleaseUnitTest :app:lintDirectRelease :app:assembleDirectRelease --console=plain)
          APK=android/app/build/outputs/apk/direct/release/app-direct-release.apk
          # Pin the signer of the actual APK; a mismatch fails here, before anything is copied or uploaded.
          python3 -I scripts/verify-direct-signing.py --apk "$APK" --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --certs-out android/app/build/direct-release-certs.txt
          mkdir -p android/app/build/direct-release
          cp "$APK" "android/app/build/direct-release/SafeNest-$SAFENEST_RELEASE_VERSION.apk"
          sha256sum "android/app/build/direct-release/SafeNest-$SAFENEST_RELEASE_VERSION.apk" > "android/app/build/direct-release/SafeNest-$SAFENEST_RELEASE_VERSION.apk.sha256"
      - name: Upload signed direct APK and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safenest-signed-direct-apk
          path: |
            safenest/android/app/build/direct-release
            safenest/android/app/build/direct-release-certs.txt
          if-no-files-found: error
          retention-days: 30
