name: SafeNest signed Play bundle
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed version name (for example 0.4.7)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: safenest-signed-release
  cancel-in-progress: false
jobs:
  signed-play:
    if: github.ref == 'refs/heads/main'
    environment: android-release
    runs-on: ubuntu-24.04 # Hold the validated runner until Ubuntu 26.04 is tested.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: safenest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - run: sh run-core-tests.sh
      - run: python3 -B -m unittest discover -s scripts/test -p 'test_*.py'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify upload identity, build and validate Play bundle
        env:
          SAFENEST_UPLOAD_KEYSTORE_BASE64: ${{ secrets.SAFENEST_UPLOAD_KEYSTORE_BASE64 }}
          SAFENEST_UPLOAD_STORE_PASSWORD: ${{ secrets.SAFENEST_UPLOAD_STORE_PASSWORD }}
          SAFENEST_UPLOAD_KEY_PASSWORD: ${{ secrets.SAFENEST_UPLOAD_KEY_PASSWORD }}
          SAFENEST_UPLOAD_KEY_ALIAS: ${{ secrets.SAFENEST_UPLOAD_KEY_ALIAS }}
          SAFENEST_UPLOAD_CERT_SHA256: ${{ vars.SAFENEST_UPLOAD_CERT_SHA256 }}
          SAFENEST_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          umask 077
          export SAFENEST_UPLOAD_KEYSTORE="$RUNNER_TEMP/safenest-upload.jks"
          trap 'rm -f "$SAFENEST_UPLOAD_KEYSTORE"' EXIT
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ.get('SAFENEST_UPLOAD_KEYSTORE_BASE64', '')
          if not raw or len(raw) > 1024 * 1024:
              raise SystemExit('Protected upload signing configuration is missing or invalid')
          Path(os.environ['SAFENEST_UPLOAD_KEYSTORE']).write_bytes(base64.b64decode(raw, validate=True))
          PY
          unset SAFENEST_UPLOAD_KEYSTORE_BASE64
          python3 scripts/verify-release-signing.py --keystore "$SAFENEST_UPLOAD_KEYSTORE"
          chmod +x android/gradlew
          (cd android && ./gradlew :app:testPlayReleaseUnitTest :app:lintPlayRelease :app:bundlePlayRelease --console=plain)
          python3 scripts/verify-release-signing.py \
            --bundle android/app/build/outputs/bundle/playRelease/app-play-release.aab \
            --manifest android/app/build/intermediates/merged_manifests/playRelease/processPlayReleaseManifest/AndroidManifest.xml \
            --version "$SAFENEST_RELEASE_VERSION" --output android/app/build/release-evidence
      - name: Upload verified bundle and public release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safenest-signed-play-release
          path: |
            safenest/android/app/build/outputs/bundle/playRelease/app-play-release.aab
            safenest/android/app/build/release-evidence
          if-no-files-found: error
          retention-days: 30
