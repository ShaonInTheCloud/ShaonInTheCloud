          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/37398312197/force-cancel"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/37398703171/force-cancel" || true
