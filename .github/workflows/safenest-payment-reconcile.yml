name: SafeNest payment reconciliation
# Re-checks recent unpaid orders with the payment gateway so a missed callback never leaves a paying
# customer without access. It does nothing until the owner adds both repository secrets below.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: safenest-payment-reconcile
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      RECONCILE_URL: ${{ secrets.SAFENEST_RECONCILE_URL }}
      RECONCILE_KEY: ${{ secrets.SAFENEST_RECONCILE_KEY }}
    steps:
      - name: Call the reconcile function
        run: |
          if [ -z "$RECONCILE_URL" ] || [ -z "$RECONCILE_KEY" ]; then
            echo "Reconciliation secrets are not configured; nothing to do."; exit 0
          fi
          case "$RECONCILE_URL" in https://*.supabase.co/functions/v1/payment-reconcile) ;; *)
            echo "SAFENEST_RECONCILE_URL must be the project's payment-reconcile function URL"; exit 1;; esac
          curl --fail-with-body --silent --show-error --max-time 60 --proto '=https' --no-location \
            -X POST -H "x-reconcile-key: $RECONCILE_KEY" "$RECONCILE_URL"
