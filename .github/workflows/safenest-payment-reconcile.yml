name: SafeNest payment reconciliation
# Checks at most 3 recent unpaid orders per run; seven-day and backlog limits require operator monitoring.
# Inert until the owner explicitly enables the repository variable AND supplies both secrets.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safenest-payment-reconcile
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Call the reconcile function
        env:
          RECONCILE_ENABLED: ${{ vars.SAFENEST_RECONCILE_ENABLED }}
          RECONCILE_URL: ${{ secrets.SAFENEST_RECONCILE_URL }}
          RECONCILE_KEY: ${{ secrets.SAFENEST_RECONCILE_KEY }}
        run: node safenest/scripts/payment-reconcile.mjs
