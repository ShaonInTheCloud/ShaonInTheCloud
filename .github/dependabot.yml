# Keeps SHA-pinned Actions, npm packages and Gradle dependencies current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /safenest
    schedule: { interval: weekly }
    groups: { npm-minor: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: /safenest/intelligence
    schedule: { interval: weekly }
    groups: { npm-minor: { update-types: [minor, patch] } }
  - package-ecosystem: gradle
    directory: /safenest/android
    schedule: { interval: weekly }
    groups: { gradle-minor: { update-types: [minor, patch] } }
